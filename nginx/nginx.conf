user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Không lộ phiên bản Nginx trong header/trang lỗi
    server_tokens off;

    # Log có thời gian phản hồi để phân tích hiệu năng bằng LogQL
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    client_body_timeout   30s;
    client_header_timeout 30s;

    # Nén - giảm băng thông cho trang quảng bá nhiều ảnh
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
