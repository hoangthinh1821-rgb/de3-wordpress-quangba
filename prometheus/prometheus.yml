# =====================================================================
# Cau hinh Prometheus - De 3
# Mo hinh Pull: cu 15s Prometheus tu "keo" metrics tu cac target
# =====================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    project: de3-wordpress-quangba
    environment: lab

# Thu muc chua alerting rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Cau hinh gui alert (bat khi them Alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # --- Prometheus tu giam sat chinh no ---
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # --- Tai nguyen host (CPU, RAM, disk, network) ---
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance_type: host

  # --- MySQL: connections, queries, innodb ---
  - job_name: mysqld-exporter
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels:
          instance_type: database

  # --- Loki: health & throughput cua he thong log ---
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance_type: logging
